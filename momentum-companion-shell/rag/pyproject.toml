[project]
name = "myriad-rag"
version = "0.1.0"
description = "Grounded, cited answers over the Myriad guide"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "psycopg[binary,pool]>=3.2",
    "pdfplumber>=0.11",
    "tiktoken>=0.7",
]

[project.optional-dependencies]
bedrock = ["boto3>=1.34"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5"]

[project.scripts]
myriad-rag = "myriad_rag.cli:main"
myriad-rag-serve = "myriad_rag.api:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/myriad_rag"]

[tool.pytest.ini_options]
pythonpath = ["src"]
