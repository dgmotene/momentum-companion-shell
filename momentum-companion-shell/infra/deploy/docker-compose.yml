# Production stack for the VM (/opt/lumina). Unlike the root docker-compose.yml,
# which bind-mounts source and runs `next dev`, this builds real images: the
# public origins are inlined into the Next bundles at build time and cannot be
# changed afterwards without rebuilding.
#
# Postgres and Adminer are deliberately not published to the host. Only Caddy
# listens on the public interface.

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      HOST_HOSTNAME: ${HOST_HOSTNAME:?set HOST_HOSTNAME in .env}
      COMPANION_HOSTNAME: ${COMPANION_HOSTNAME:?set COMPANION_HOSTNAME in .env}
      BACKEND_HOSTNAME: ${BACKEND_HOSTNAME:?set BACKEND_HOSTNAME in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/etc/caddy/certs:ro
      - caddy_data:/data
      - caddy_config:/config
    deploy:
      resources:
        limits:
          memory: 128m
    depends_on:
      - host
      - companion
      - backend

  host:
    build:
      context: ../..
      dockerfile: host/Dockerfile
      args:
        NEXT_PUBLIC_COMPANION_ORIGIN: ${COMPANION_ORIGIN:?set COMPANION_ORIGIN in .env}
    restart: unless-stopped
    environment:
      JWT_PRIVATE_KEY_PATH: /keys/private.pem
      JWT_PUBLIC_KEY_PATH: /keys/public.pem
      JWT_ISSUER: ${JWT_ISSUER:-https://mock-host.local}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-companion-backend}
    volumes:
      - ../../keys:/keys:ro
    expose:
      - "3000"
    deploy:
      resources:
        limits:
          memory: 512m

  companion:
    build:
      context: ../..
      dockerfile: companion/Dockerfile
      args:
        NEXT_PUBLIC_HOST_ORIGIN: ${HOST_ORIGIN_PUBLIC:?set HOST_ORIGIN_PUBLIC in .env}
        NEXT_PUBLIC_COMPANION_BACKEND_URL: ${BACKEND_ORIGIN:?set BACKEND_ORIGIN in .env}
    restart: unless-stopped
    expose:
      - "3001"
    deploy:
      resources:
        limits:
          memory: 512m

  backend:
    build:
      context: ../..
      dockerfile: companion-backend/Dockerfile
    restart: unless-stopped
    environment:
      COMPANION_BACKEND_PORT: 4000
      # Server-side JWKS fetch stays on the internal network; it never needs to
      # leave the box and go back in through Cloudflare.
      HOST_ORIGIN: http://host:3000
      COMPANION_ALLOWED_ORIGIN: ${COMPANION_ORIGIN}
      JWT_ISSUER: ${JWT_ISSUER:-https://mock-host.local}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-companion-backend}
      DATABASE_URL: postgres://companion:companion@db:5432/companion
      GATEWAY_BASE_URL: ${GATEWAY_BASE_URL:?set GATEWAY_BASE_URL in .env}
      UNIVERSAL_API_KEY: ${UNIVERSAL_API_KEY:?set UNIVERSAL_API_KEY in .env}
      CHAT_MODEL_URL: ${CHAT_MODEL_URL:?set CHAT_MODEL_URL in .env}
      EMBEDDING_MODEL_URL: ${EMBEDDING_MODEL_URL:-bedrock/amazon.titan-embed-text-v2:0}
      # Read with ?? in chat.js, so an empty string would become 0 and disable
      # the similarity floor entirely.
      RAG_MIN_SIMILARITY: ${RAG_MIN_SIMILARITY:-0.2}
      TRANSLATION_PROVIDER: ${TRANSLATION_PROVIDER:-none}
      VULAVULA_API_TOKEN: ${VULAVULA_API_TOKEN:-}
    expose:
      - "4000"
    deploy:
      resources:
        limits:
          memory: 512m
    depends_on:
      db:
        condition: service_healthy

  db:
    image: pgvector/pgvector:pg15
    restart: unless-stopped
    environment:
      POSTGRES_USER: companion
      POSTGRES_PASSWORD: companion
      POSTGRES_DB: companion
    volumes:
      # Applied in filename order, first boot only. Same RAG schema file the
      # Python service migrates with, so the two cannot drift.
      - ../../db/seed.sql:/docker-entrypoint-initdb.d/001-seed.sql:ro
      - ../../rag/src/myriad_rag/sql/001_schema.sql:/docker-entrypoint-initdb.d/002-rag-schema.sql:ro
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U companion -d companion"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 1g

volumes:
  dbdata:
  caddy_data:
  caddy_config:
